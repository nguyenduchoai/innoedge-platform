version: "0.1.3"
description: >-
  InnoEdge SDK — IoT device infrastructure for ESP32 monetization:
  WiFi BLE/SoftAP provisioning, persistent NVS transaction queue,
  idempotent command bus with deduplication, dynamic config caching,
  brick-proof TLS OTA with rollback, and multi-WAN failover.
url: https://github.com/nguyenduchoai/innoedge-platform
repository: https://github.com/nguyenduchoai/innoedge-platform.git
documentation: https://github.com/nguyenduchoai/innoedge-platform#readme
issues: https://github.com/nguyenduchoai/innoedge-platform/issues
license: "Apache-2.0"

tags:
  - iot
  - websocket
  - ota
  - provisioning
  - payment
  - coin-op
  - vending

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3

dependencies:
  idf:
    version: ">=5.1"
  espressif/esp_websocket_client:
    version: "^1.4.0"

files:
  exclude:
    - "**/*.log"
    - "**/build/**/*"
    - "**/build_*/**/*"
    - "**/managed_components/**/*"
    - "**/dependencies.lock"
    - "**/sdkconfig"
    - "**/sdkconfig.old"

examples:
  - path: ../../examples/01-hello-device
  - path: ../../examples/02-telemetry
  - path: ../../examples/03-remote-command
  - path: ../../examples/04-device-config
  - path: ../../examples/05-ota
  - path: ../../examples/06-coin-relay
  - path: ../../examples/07-qr-payment
  - path: ../../examples/08-carwash
  - path: ../../examples/09-ai-agent
  - path: ../../examples/10-edu-tutor
  - path: ../../examples/11-voice-assistant
  - path: ../../examples/12-muse-gadget
  - path: ../../examples/13-stem-robot
  - path: ../../examples/14-digital-signage
  - path: ../../examples/15-central-audio
