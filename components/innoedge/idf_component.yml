version: "0.1.1"
description: >-
  InnoEdge SDK — IoT device infrastructure for ESP32 monetization:
  WiFi BLE/SoftAP provisioning, persistent NVS transaction queue,
  idempotent command bus with deduplication, dynamic config caching,
  brick-proof TLS OTA with rollback, and multi-WAN failover.
url: https://github.com/nguyenduchoai/innoedge-platform
repository: https://github.com/nguyenduchoai/innoedge-platform.git
documentation: https://github.com/nguyenduchoai/innoedge-platform#readme
issues: https://github.com/nguyenduchoai/innoedge-platform/issues
license: "Apache-2.0"

tags:
  - iot
  - websocket
  - ota
  - provisioning
  - payment
  - coin-op
  - vending

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3

dependencies:
  idf:
    version: ">=5.1"
  espressif/esp_websocket_client:
    version: "^1.4.0"

# Không khai "examples:" ở đây: đường dẫn phải nằm TRONG gói component, mà
# example của SDK nằm ở examples/ ngoài thư mục này. Người dùng xem example trên
# GitHub (link documentation ở trên).
