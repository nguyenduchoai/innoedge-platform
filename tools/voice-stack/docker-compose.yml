# InnoEdge voice stack — hai sidecar tiếng Việt chạy trên server local.
#
#   docker compose up -d                     # cả hai
#   docker compose up -d vieneu-tts          # chỉ TTS (không cần GPU)
#   docker compose --profile gpu up -d       # thêm Qwen3-ASR (cần NVIDIA)
#
# Lấy từ VIMATE Edu (đang chạy thật cho trẻ em), rút gọn cho máy dev: publish
# port ra localhost, bỏ giới hạn tài nguyên production. Mã sidecar giữ nguyên.
#
# Lần đầu: build tải model từ Hugging Face (VieNeu ~1 GB, Qwen3-ASR ~4 GB) —
# mất vài phút tới vài chục phút tuỳ mạng. Sau đó runtime hoàn toàn offline.

services:
  # ── VieNeu TTS: giọng Việt tự nhiên, CPU/ONNX INT8 — KHÔNG cần GPU ─────────
  vieneu-tts:
    build:
      context: ./vieneu-tts
      args:
        VIENEU_VERSION: "3.3.0"
        VIENEU_DEVICE: ${VIENEU_DEVICE:-cpu}
        VIENEU_SOURCE_COMMIT: "36c4b501b0634a8f59805e6b529a058fbd30190b"
        VIENEU_MODEL_REVISION: ${VIENEU_MODEL_REVISION:-2da0efab622a1722125991736524f080b751ef5b}
        VIENEU_CODEC_REVISION: ${VIENEU_CODEC_REVISION:-ceff0d0749bfb3fa2d61149794ec6feef0d1e1ae}
    image: innoedge-vieneu-tts:3.3.0
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "${VIENEU_PORT:-8080}:8080"
    environment:
      VIENEU_DEVICE: ${VIENEU_DEVICE:-cpu}
      # Để rỗng = không bắt auth (máy dev). Đặt key khi server có người khác truy cập.
      VIENEU_API_KEY: ${VIENEU_TTS_API_KEY:-}
      VIENEU_REQUIRE_API_KEY: ${VIENEU_REQUIRE_API_KEY:-false}
      VIENEU_MODEL_ID: vieneu-v3-turbo
      VIENEU_MODEL_REPO: pnnbao-ump/VieNeu-TTS-v3-Turbo
      VIENEU_MODEL_REVISION: ${VIENEU_MODEL_REVISION:-2da0efab622a1722125991736524f080b751ef5b}
      VIENEU_CODEC_REPO: OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano-ONNX
      VIENEU_CODEC_REVISION: ${VIENEU_CODEC_REVISION:-ceff0d0749bfb3fa2d61149794ec6feef0d1e1ae}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VIENEU_MODELS_BAKED: "1"
      VIENEU_DEFAULT_VOICE: ${VIENEU_DEFAULT_VOICE:-Phạm Tuyên}
      VIENEU_DEFAULT_STYLE: ${VIENEU_DEFAULT_STYLE:-tu_nhien}
      VIENEU_THREADS: ${VIENEU_THREADS:-4}
      VIENEU_QUEUE_SIZE: "8"
      VIENEU_REQUEST_TIMEOUT_SECONDS: "75"
      VIENEU_MAX_TEXT_CHARS: "600"
      VIENEU_MAX_AUDIO_SECONDS: "60"
      VIENEU_APPLY_WATERMARK: ${VIENEU_APPLY_WATERMARK:-true}
    volumes:
      - vieneu_voices:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10m
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

  # ── Qwen3-ASR: nhận dạng tiếng Việt qua vLLM — CẦN NVIDIA GPU ≥ 10 GB VRAM ──
  qwen3-asr:
    profiles: ["gpu"]
    build:
      context: ./qwen3-asr
      args:
        VLLM_IMAGE: ${QWEN3_ASR_VLLM_IMAGE:-vllm/vllm-openai:v0.16.0@sha256:4801151759655c57606c844662e5213403c032a62d149c7ce61d615759a821ef}
        VLLM_VERSION: "0.16.0"
    image: innoedge-qwen3-asr:vllm-0.16.0
    platform: linux/amd64
    restart: unless-stopped
    init: true
    shm_size: "4gb"
    ports:
      - "${QWEN3_ASR_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      NVIDIA_VISIBLE_DEVICES: ${QWEN3_ASR_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      QWEN3_ASR_MODEL: ${QWEN3_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      QWEN3_ASR_REVISION: ${QWEN3_ASR_REVISION:-7278e1e70fe206f11671096ffdd38061171dd6e5}
      QWEN3_ASR_SERVED_MODEL: ${QWEN3_ASR_SERVED_MODEL:-Qwen/Qwen3-ASR-1.7B}
      QWEN3_ASR_GPU_MEMORY_UTILIZATION: ${QWEN3_ASR_GPU_MEMORY_UTILIZATION:-0.62}
      QWEN3_ASR_MAX_NUM_SEQS: "4"
      QWEN3_ASR_MAX_MODEL_LEN: "4096"
      QWEN3_ASR_DTYPE: ${QWEN3_ASR_DTYPE:-half}
      QWEN3_ASR_ENFORCE_EAGER: "true"
      QWEN3_ASR_API_KEY: ${QWEN3_ASR_API_KEY:-}
    volumes:
      # Cache model sống qua rebuild — lần đầu tải ~4 GB, lần sau không.
      - ${QWEN3_ASR_HF_CACHE_DIR:-./data/hf-cache}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "/usr/local/bin/qwen3-asr-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5m
    stop_grace_period: 2m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  vieneu_voices:
