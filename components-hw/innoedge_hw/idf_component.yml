version: "0.1.2"
description: >-
  Sample hardware peripheral drivers for InnoEdge SDK: coin/bill pulse input with debouncing,
  multi-channel relay control, timed carwash session controller, MDB cashless vending, and Modbus RTU.
url: https://github.com/nguyenduchoai/innoedge-platform
repository: https://github.com/nguyenduchoai/innoedge-platform.git
documentation: https://github.com/nguyenduchoai/innoedge-platform#readme
issues: https://github.com/nguyenduchoai/innoedge-platform/issues
license: "Apache-2.0"

tags:
  - iot
  - relay
  - coin-acceptor
  - pulse
  - carwash
  - mdb
  - modbus

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3

dependencies:
  idf:
    version: ">=5.1"
  nguyenduchoai/innoedge:
    version: "^0.1.4"

files:
  exclude:
    - "**/*.log"
    - "**/build/**/*"
    - "**/build_*/**/*"
    - "**/managed_components/**/*"
    - "**/dependencies.lock"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
