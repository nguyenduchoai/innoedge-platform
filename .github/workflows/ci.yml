name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Nhanh, không cần ESP-IDF: test command bus (C) + mock-cloud và MCP (Go).
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: ./tests/run.sh

  # Build THẬT bằng ESP-IDF. Đây là thứ chứng minh 8 example còn chạy được —
  # đừng bỏ job này để CI nhanh hơn.
  build-examples:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-hello-device
          - 02-telemetry
          - 03-remote-command
          - 04-device-config
          - 05-ota
          - 06-coin-relay
          - 07-qr-payment
          - 08-carwash
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.example }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd "examples/${{ matrix.example }}"
          idf.py set-target esp32s3
          idf.py build

  # Chốt tuyên bố "ESP-IDF >= 5.1" trong README. Chỉ chạy một example là đủ —
  # nếu bản sàn vỡ thì vỡ ngay ở đây.
  idf-floor:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd examples/01-hello-device
          idf.py set-target esp32s3
          idf.py build
